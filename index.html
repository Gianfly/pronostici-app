<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>OVER 1.5 PREDICTOR</title>

<style>

body{
margin:0;
padding:15px;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
}

h1{
text-align:center;
}

.filtri{
display:grid;
gap:10px;
margin-bottom:20px;
}

input,select{
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
background:#1e293b;
color:white;
}

.card{
background:#1e293b;
padding:15px;
border-radius:16px;
margin-bottom:15px;
}

.match{
font-size:22px;
font-weight:bold;
margin-bottom:10px;
}

.alta{color:#22c55e;}
.buona{color:#3b82f6;}
.discreta{color:#f59e0b;}
.scarsa{color:#ef4444;}

</style>
</head>
<body>

<h1>⚽ OVER 1.5 PREDICTOR</h1>

<div class="filtri">

<input
type="date"
id="filtroData"
>

<select id="filtroCampionato">
<option value="TUTTI">
🏆 Tutti i campionati
</option>
</select>

</div>

<div id="lista"></div>

<script>

let tutteLePartite=[];

function puntiOver(v){

if(v>=5) return 3;
if(v===4) return 2;
if(v===3) return 1;

return 0;

}

function puntiMedia(v){

if(v>=3) return 3;
if(v>=2.5) return 2;
if(v>=2) return 1;

return 0;

}

function calcolaScore(p){

return (

puntiOver(p.casa_over15)+
puntiOver(p.ospite_over15)+
puntiMedia(p.media_casa)+
puntiMedia(p.media_ospite)

);

}

function affidabilita(score){

if(score>=11) return "ALTA";
if(score>=8) return "BUONA";
if(score>=5) return "DISCRETA";

return "SCARSA";

}

function render(partite){

partite.sort(
(a,b)=>calcolaScore(b)-calcolaScore(a)
);

let html="";

partite.forEach(p=>{

let score=
calcolaScore(p);

let livello=
affidabilita(score);

html += `

<div class="card">

<div class="match">
${p.partita}
</div>

<div>
🏆 ${p.campionato}
</div>

<div>
📅 ${p.data}
</div>

<div>
🕒 ${p.ora}
</div>

<div>
📈 Casa Over 1.5:
${p.casa_over15}/5
</div>

<div>
📈 Ospite Over 1.5:
${p.ospite_over15}/5
</div>

<div>
⚽ Media Casa:
${p.media_casa}
</div>

<div>
⚽ Media Ospite:
${p.media_ospite}
</div>

<div class="${livello.toLowerCase()}">

📊 Score ${score}/12

</div>

<div class="${livello.toLowerCase()}">

🏅 ${livello}

</div>

</div>

`;

});

document.getElementById(
"lista"
).innerHTML = html;

}

function applicaFiltri(){

let risultati=[...tutteLePartite];

let data=
document.getElementById(
"filtroData"
).value;

let campionato=
document.getElementById(
"filtroCampionato"
).value;

if(data){

risultati=
risultati.filter(
p=>p.data===data
);

}

if(campionato!=="TUTTI"){

risultati=
risultati.filter(
p=>p.campionato===campionato
);

}

render(risultati);

}

fetch("partite.json?v="+Date.now())

.then(r=>r.json())

.then(dati=>{

tutteLePartite=dati;

let campionati=[
...new Set(
dati.map(
p=>p.campionato
)
)
];

campionati.sort();

campionati.forEach(c=>{

let op=
document.createElement(
"option"
);

op.value=c;
op.textContent=c;

document
.getElementById(
"filtroCampionato"
)
.appendChild(op);

});

render(dati);

document
.getElementById(
"filtroData"
)
.addEventListener(
"change",
applicaFiltri
);

document
.getElementById(
"filtroCampionato"
)
.addEventListener(
"change",
applicaFiltri
);

});

</script>

</body>
</html>
