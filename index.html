<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronostici Calcio</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  font-size: 32px;
}

h2 {
  margin-top: 30px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

.card {
  background: #1f2937;
  margin: 12px 0;
  padding: 15px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}

.over {
  border-left: 6px solid #22c55e;
}

.under {
  border-left: 6px solid #ef4444;
}

.match {
  font-size: 18px;
  font-weight: bold;
}

.info {
  font-size: 14px;
  color: #d1d5db;
  margin-top: 5px;
}

.quota {
  font-size: 20px;
  font-weight: bold;
  margin-top: 8px;
}

.loading {
  color: #facc15;
  margin-top: 10px;
}

.error {
  color: #f87171;
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>⚽ Pronostici Calcio</h1>

<button onclick="caricaDati()">🔄 Aggiorna</button>

<h2>🟢 Over 1.5</h2>
<div id="over">TEST OVER</div>

<h2>🔴 Under 2.5</h2>
<div id="under">TEST UNDER</div>

<script>
const API_KEY = "fbfc72a65736699d483a2c09ec4621c5";

async function caricaDati() {
  const overDiv = document.getElementById("over");
  const underDiv = document.getElementById("under");

  overDiv.innerHTML = "<div class='loading'>Caricamento Over 1.5...</div>";
  underDiv.innerHTML = "<div class='loading'>Caricamento Under 2.5...</div>";

  try {
    const url =
      "https://api.the-odds-api.com/v4/sports/soccer_epl/odds/" +
      "?apiKey=" + API_KEY +
      "&regions=eu" +
      "&markets=totals" +
      "&oddsFormat=decimal";

    const response = await fetch(url);
    const data = await response.json();

    if (!Array.isArray(data)) {
      overDiv.innerHTML = "<div class='error'>Errore API o limite richieste raggiunto.</div>";
      underDiv.innerHTML = "<div class='error'>Controlla API key o piano gratuito.</div>";
      return;
    }

    let overHTML = "";
    let underHTML = "";

    data.forEach(partita => {
      const nomePartita = partita.home_team + " - " + partita.away_team;
      const ora = new Date(partita.commence_time).toLocaleString("it-IT");

      if (!partita.bookmakers || partita.bookmakers.length === 0) return;

      partita.bookmakers.forEach(bookmaker => {
        if (!bookmaker.markets) return;

        bookmaker.markets.forEach(market => {
          if (market.key !== "totals") return;

          market.outcomes.forEach(outcome => {
            const quota = outcome.price;
            const linea = outcome.point;

            if (outcome.name === "Over" && linea === 1.5) {
              overHTML += `
                <div class="card over">
                  <div class="match">${nomePartita}</div>
                  <div class="info">${ora}</div>
                  <div class="info">Bookmaker: ${bookmaker.title}</div>
                  <div class="quota">Over 1.5 - Quota ${quota}</div>
                </div>
              `;
            }

            if (outcome.name === "Under" && linea === 2.5) {
              underHTML += `
                <div class="card under">
                  <div class="match">${nomePartita}</div>
                  <div class="info">${ora}</div>
                  <div class="info">Bookmaker: ${bookmaker.title}</div>
                  <div class="quota">Under 2.5 - Quota ${quota}</div>
                </div>
              `;
            }
          });
        });
      });
    });

    overDiv.innerHTML = overHTML || "<div class='error'>Nessun Over 1.5 trovato.</div>";
    underDiv.innerHTML = underHTML || "<div class='error'>Nessun Under 2.5 trovato.</div>";

  } catch (errore) {
    overDiv.innerHTML = "<div class='error'>Errore nel caricamento dati.</div>";
    underDiv.innerHTML = "<div class='error'>Errore nel caricamento dati.</div>";
    console.log(errore);
  }
}

caricaDati();
</script>

</body>
</html>
