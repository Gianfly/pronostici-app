<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#07111f">

<title>Pronostici Over 1.5</title>

<style>
:root {
  --sfondo: #07111f;
  --pannello: #0f1d30;
  --card: #162438;
  --bordo: #2b3d55;
  --testo: #f8fafc;
  --secondario: #a8b5c7;
  --verde: #22c55e;
  --blu: #2563eb;
  --rosso: #ef4444;
  --giallo: #facc15;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--sfondo);
}

body {
  margin: 0;
  min-height: 100vh;
  padding:
    max(18px, env(safe-area-inset-top))
    15px
    max(30px, env(safe-area-inset-bottom));

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    radial-gradient(circle at top, #173454 0, var(--sfondo) 350px);

  color: var(--testo);
}

.contenitore {
  width: 100%;
  max-width: 760px;
  margin: auto;
}

.intestazione {
  text-align: center;
  padding: 8px 5px 20px;
}

.logo {
  width: 62px;
  height: 62px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 20px;
  background: linear-gradient(135deg, #16a34a, #22c55e);
  font-size: 31px;
  box-shadow: 0 10px 30px rgba(34, 197, 94, 0.25);
}

h1 {
  margin: 12px 0 0;
  font-size: 28px;
}

.sottotitolo {
  margin-top: 7px;
  color: var(--secondario);
  font-size: 14px;
  line-height: 1.45;
}

.pannello {
  padding: 15px;
  background: rgba(15, 29, 48, 0.96);
  border: 1px solid var(--bordo);
  border-radius: 18px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
}

.filtri {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

label {
  display: block;
  margin: 0 0 6px;
  color: var(--secondario);
  font-size: 13px;
  font-weight: 750;
}

input,
select {
  width: 100%;
  min-height: 48px;
  padding: 11px 12px;
  border: 1px solid var(--bordo);
  border-radius: 12px;
  background: white;
  color: #111827;
  font-size: 16px;
}

.gruppo-quote {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

button {
  width: 100%;
  min-height: 50px;
  margin-top: 13px;
  border: none;
  border-radius: 13px;
  background: linear-gradient(135deg, var(--blu), #3b82f6);
  color: white;
  font-size: 16px;
  font-weight: 850;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

.pulsante-reset {
  margin-top: 9px;
  background: #334155;
}

.stato {
  margin-top: 12px;
  color: var(--secondario);
  font-size: 13px;
  line-height: 1.5;
}

.titolo-risultati {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 23px 2px 12px;
}

.titolo-risultati h2 {
  margin: 0;
  font-size: 20px;
}

.contatore {
  padding: 6px 10px;
  border-radius: 999px;
  background: var(--card);
  color: var(--secondario);
  font-size: 12px;
  font-weight: bold;
}

.card {
  position: relative;
  overflow: hidden;
  padding: 17px;
  margin-bottom: 13px;
  background:
    linear-gradient(
      145deg,
      rgba(30, 56, 80, 0.98),
      rgba(22, 36, 56, 0.98)
    );
  border: 1px solid var(--bordo);
  border-left: 6px solid var(--verde);
  border-radius: 17px;
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.26);
}

.partita {
  position: relative;
  z-index: 1;
  font-size: 19px;
  font-weight: 850;
  line-height: 1.35;
}

.dettagli {
  position: relative;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 11px;
}

.etichetta {
  padding: 6px 9px;
  border: 1px solid var(--bordo);
  border-radius: 999px;
  background: rgba(7, 17, 31, 0.58);
  color: #d8e1ec;
  font-size: 12px;
}

.pronostico {
  position: relative;
  z-index: 1;
  margin-top: 14px;
  color: #4ade80;
  font-size: 17px;
  font-weight: 850;
}

.riga-finale {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 9px;
  margin-top: 12px;
}

.quota {
  font-size: 17px;
  font-weight: 850;
}

.affidabilita {
  padding: 7px 10px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 900;
}

.alta {
  background: #14532d;
  color: #bbf7d0;
}

.buona {
  background: #1e3a8a;
  color: #bfdbfe;
}

.discreta {
  background: #78350f;
  color: #fde68a;
}

.caricamento,
.vuoto,
.errore {
  padding: 18px;
  border-radius: 15px;
  line-height: 1.55;
}

.caricamento {
  background: var(--card);
  color: var(--giallo);
}

.vuoto {
  background: var(--card);
  border: 1px dashed #64748b;
  color: var(--secondario);
}

.errore {
  background: #450a0a;
  border: 1px solid #991b1b;
  color: #fecaca;
}

.aggiornamento {
  margin-top: 9px;
  text-align: center;
  color: #7e8da2;
  font-size: 12px;
}

.avviso {
  margin-top: 22px;
  padding: 13px;
  border-radius: 13px;
  background: rgba(15, 29, 48, 0.82);
  color: #8795a8;
  font-size: 12px;
  line-height: 1.5;
  text-align: center;
}

@media (min-width: 620px) {
  .filtri {
    grid-template-columns: 1fr 1fr;
  }

  .campo-intero,
  .gruppo-quote {
    grid-column: 1 / -1;
  }
}
</style>
</head>

<body>

<main class="contenitore">

  <header class="intestazione">

    <div class="logo">⚽</div>

    <h1>Pronostici Over 1.5</h1>

    <div class="sottotitolo">
      Tutti i campionati presenti nel file partite.json
    </div>

  </header>

  <section class="pannello">

    <div class="filtri">

      <div>
        <label for="dataScelta">📅 Data</label>
        <input type="date" id="dataScelta">
      </div>

      <div>
        <label for="campionatoScelto">🏆 Campionato</label>

        <select id="campionatoScelto">
          <option value="TUTTI">
            Tutti i campionati
          </option>
        </select>
      </div>

      <div>
        <label for="filtroAffidabilita">
          📊 Affidabilità
        </label>

        <select id="filtroAffidabilita">
          <option value="TUTTE">Tutte</option>
          <option value="ALTA">Alta</option>
          <option value="BUONA">Buona</option>
          <option value="DISCRETA">Discreta</option>
        </select>
      </div>

      <div>
        <label for="ordinamento">
          ↕️ Ordinamento
        </label>

        <select id="ordinamento">
          <option value="ORARIO">
            Per orario
          </option>

          <option value="QUOTA_CRESCENTE">
            Quota più bassa
          </option>

          <option value="QUOTA_DECRESCENTE">
            Quota più alta
          </option>

          <option value="AFFIDABILITA">
            Affidabilità
          </option>
        </select>
      </div>

      <div class="campo-intero">
        <label for="ricercaSquadra">
          🔎 Cerca squadra o partita
        </label>

        <input
          type="search"
          id="ricercaSquadra"
          placeholder="Esempio: Juventus"
        >
      </div>

      <div class="gruppo-quote">

        <div>
          <label for="quotaMinima">
            Quota minima
          </label>

          <input
            type="number"
            id="quotaMinima"
            value="1.30"
            min="1.01"
            max="10"
            step="0.01"
          >
        </div>

        <div>
          <label for="quotaMassima">
            Quota massima
          </label>

          <input
            type="number"
            id="quotaMassima"
            value="1.50"
            min="1.01"
            max="10"
            step="0.01"
          >
        </div>

      </div>

    </div>

    <button id="pulsanteAggiorna" type="button">
      🔄 Aggiorna partite
    </button>

    <button
      id="pulsanteReset"
      class="pulsante-reset"
      type="button"
    >
      Azzera filtri
    </button>

    <div id="stato" class="stato">
      Caricamento automatico in corso.
    </div>

  </section>

  <div class="titolo-risultati">

    <h2>🟢 Selezioni del giorno</h2>

    <span id="contatore" class="contatore">
      0 partite
    </span>

  </div>

  <section id="listaPartite">

    <div class="caricamento">
      Caricamento delle partite...
    </div>

  </section>

  <div
    id="ultimoAggiornamento"
    class="aggiornamento"
  ></div>

  <div class="avviso">
    Le selezioni hanno finalità informative.
    Nessun pronostico garantisce il risultato.
  </div>

</main>

<script>
const FILE_PARTITE = "partite.json";

let tutteLePartite = [];

function dataOggi() {
  const oggi = new Date();

  const anno = oggi.getFullYear();

  const mese = String(
    oggi.getMonth() + 1
  ).padStart(2, "0");

  const giorno = String(
    oggi.getDate()
  ).padStart(2, "0");

  return anno + "-" + mese + "-" + giorno;
}

function normalizzaQuota(quota) {
  const numero = Number(
    String(quota).replace(",", ".")
  );

  return Number.isFinite(numero)
    ? numero
    : 0;
}

function pulisciTesto(testo) {
  return String(testo || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function classeAffidabilita(valore) {
  const affidabilita =
    String(valore || "").toUpperCase();

  if (affidabilita === "ALTA") {
    return "alta";
  }

  if (affidabilita === "BUONA") {
    return "buona";
  }

  return "discreta";
}

function valoreAffidabilita(valore) {
  const affidabilita =
    String(valore || "").toUpperCase();

  if (affidabilita === "ALTA") {
    return 3;
  }

  if (affidabilita === "BUONA") {
    return 2;
  }

  return 1;
}
