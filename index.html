<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Over 1.5 Predictor</title>

<style>

body{
    margin:0;
    padding:15px;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    margin:0;
    font-size:32px;
}

.header p{
    color:#94a3b8;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:20px;
}

.stat{
    background:#1e293b;
    padding:15px;
    border-radius:15px;
    text-align:center;
}

.stat h3{
    margin:0;
    font-size:24px;
}

.stat span{
    color:#94a3b8;
    font-size:12px;
}

.filtri{
    margin-bottom:20px;
}

select{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:none;
    background:#1e293b;
    color:white;
    font-size:16px;
}

.card{
    background:#1e293b;
    border-left:6px solid #22c55e;
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
}

.match{
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
}

.info{
    margin-bottom:6px;
    color:#cbd5e1;
}

.score{
    margin-top:15px;
    font-size:24px;
    font-weight:bold;
}

.alta{
    color:#22c55e;
}

.buona{
    color:#3b82f6;
}

.discreta{
    color:#f59e0b;
}

.scarsa{
    color:#ef4444;
}

</style>
</head>
<body>

<div class="header">
<h1>⚽ OVER 1.5 PREDICTOR</h1>
<p>Algoritmo V1.0</p>
</div>

<div class="stats">

<div class="stat">
<h3 id="totale">0</h3>
<span>Partite</span>
</div>

<div class="stat">
<h3 id="alta">0</h3>
<span>Alta</span>
</div>

<div class="stat">
<h3 id="buona">0</h3>
<span>Buona+</span>
</div>

</div>

<div class="filtri">

<select id="filtroCampionato">

<option value="TUTTI">
🏆 Tutti i campionati
</option>

</select>

</div>

<div id="lista"></div>

<script>

let tutteLePartite=[];

function renderPartite(dati){

dati.sort((a,b)=>b.score-a.score);

let html="";

dati.forEach(p=>{

html+=`

<div class="card">

<div class="match">
${p.partita}
</div>

<div class="info">
🏆 ${p.campionato}
</div>

<div class="info">
🕒 ${p.ora}
</div>

<div class="info">
📈 Casa Over 1.5: ${p.casa_over15}/5
</div>

<div class="info">
📈 Ospite Over 1.5: ${p.ospite_over15}/5
</div>

<div class="info">
⚽ Media Gol Casa: ${p.media_casa}
</div>

<div class="info">
⚽ Media Gol Ospite: ${p.media_ospite}
</div>

<div class="score ${p.affidabilita.toLowerCase()}">
📊 Score ${p.score}/12
</div>

<div class="${p.affidabilita.toLowerCase()}">
🏅 ${p.affidabilita}
</div>

</div>

`;

});

document.getElementById(
"lista"
).innerHTML=html;

}

fetch("partite.json?v="+Date.now())

.then(r=>r.json())

.then(dati=>{

tutteLePartite=dati;

let alta=0;
let buona=0;

document.getElementById(
"totale"
).innerText=dati.length;

dati.forEach(p=>{

if(
p.affidabilita==="ALTA"
) alta++;

if(
p.affidabilita==="ALTA" ||
p.affidabilita==="BUONA"
) buona++;

});

document.getElementById(
"alta"
).innerText=alta;

document.getElementById(
"buona"
).innerText=buona;

const select=
document.getElementById(
"filtroCampionato"
);

const campionati=[
...new Set(
dati.map(
p=>p.campionato
)
)
];

campionati.sort();

campionati.forEach(c=>{

const option=
document.createElement("option");

option.value=c;

option.textContent=c;

select.appendChild(option);

});

renderPartite(dati);

select.addEventListener(
"change",
()=>{

const valore=select.value;

if(
valore==="TUTTI"
){

renderPartite(
tutteLePartite
);

return;

}

renderPartite(

tutteLePartite.filter(
p=>p.campionato===valore
)

);

}

);

});

</script>

</body>
</html>
