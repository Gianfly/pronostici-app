<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronostici Calcio</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  font-size: 28px;
  margin-bottom: 20px;
}

h2 {
  margin-top: 30px;
  font-size: 22px;
}

.controls {
  background: #1f2937;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 20px;
}

label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}

input[type="date"] {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  margin-bottom: 12px;
}

button {
  width: 100%;
  background: #2563eb;
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

.card {
  background: #1f2937;
  margin: 12px 0;
  padding: 15px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}

.over {
  border-left: 6px solid #22c55e;
}

.under {
  border-left: 6px solid #ef4444;
}

.match {
  font-size: 18px;
  font-weight: bold;
}

.info {
  color: #d1d5db;
  font-size: 14px;
  margin-top: 5px;
}

.quota {
  font-size: 20px;
  font-weight: bold;
  margin-top: 8px;
}

.loading {
  color: #facc15;
  margin-top: 10px;
}

.error {
  color: #f87171;
  margin-top: 10px;
}

.note {
  color: #9ca3af;
  font-size: 13px;
  margin-top: 10px;
  line-height: 1.4;
}
</style>
</head>

<body>

<h1>⚽ Pronostici Calcio</h1>

<div class="controls">
  <label for="dataScelta">Scegli il giorno</label>
  <input type="date" id="dataScelta">

  <button onclick="caricaDati()">🔄 Aggiorna</button>

  <div class="note">
    Mostra solo le partite del giorno selezionato.<br>
    🟢 Over 2.5 con quota massima 1.80<br>
    🔴 Under 2.5 con quota massima 1.70
  </div>
</div>

<h2>🟢 Over 2.5 filtrati</h2>
<div id="over">Caricamento...</div>

<h2>🔴 Under 2.5 filtrati</h2>
<div id="under">Caricamento...</div>

<script>
const API_KEY = "fbfc72a65736699d483a2c09ec4621c5";

const CAMPIONATI = [
  { key: "soccer_epl", nome: "Premier League" },
  { key: "soccer_italy_serie_a", nome: "Serie A" },
  { key: "soccer_spain_la_liga", nome: "La Liga" },
  { key: "soccer_germany_bundesliga", nome: "Bundesliga" },
  { key: "soccer_france_ligue_one", nome: "Ligue 1" },
  { key: "soccer_uefa_champs_league", nome: "Champions League" },
  { key: "soccer_uefa_europa_league", nome: "Europa League" }
];

const SOGLIA_OVER_25 = 1.80;
const SOGLIA_UNDER_25 = 1.70;

function impostaDataOggi() {
  const input = document.getElementById("dataScelta");
  const oggi = new Date();

  const anno = oggi.getFullYear();
  const mese = String(oggi.getMonth() + 1).padStart(2, "0");
  const giorno = String(oggi.getDate()).padStart(2, "0");

  input.value = anno + "-" + mese + "-" + giorno;
}

function dataLocaleDaISO(dataISO) {
  const data = new Date(dataISO);

  const anno = data.getFullYear();
  const mese = String(data.getMonth() + 1).padStart(2, "0");
  const giorno = String(data.getDate()).padStart(2, "0");

  return anno + "-" + mese + "-" + giorno;
}

function intervalloUTCPerData(dataScelta) {
  const inizioLocale = new Date(dataScelta + "T00:00:00");
  const fineLocale = new Date(dataScelta + "T23:59:59");

  return {
    inizio: inizioLocale.toISOString(),
    fine: fineLocale.toISOString()
  };
}

function probabilitaDaQuota(quota) {
  return Math.round((1 / quota) * 100);
}

async function caricaDati() {
  const overDiv = document.getElementById("over");
  const underDiv = document.getElementById("under");
  const dataScelta = document.getElementById("dataScelta").value;

  overDiv.innerHTML = "<div class='loading'>Caricamento Over 2.5...</div>";
  underDiv.innerHTML = "<div class='loading'>Caricamento Under 2.5...</div>";

  let overList = [];
  let underList = [];

  const intervallo = intervalloUTCPerData(dataScelta);

  try {
    for (const campionato of CAMPIONATI) {
      const url =
        "https://api.the-odds-api.com/v4/sports/" +
        campionato.key +
        "/odds/?" +
        "apiKey=" + API_KEY +
        "&regions=eu" +
        "&markets=totals" +
        "&oddsFormat=decimal" +
        "&dateFormat=iso" +
        "&commenceTimeFrom=" + encodeURIComponent(intervallo.inizio) +
        "&commenceTimeTo=" + encodeURIComponent(intervallo.fine);

      const response = await fetch(url);
      const data = await response.json();

      if (!Array.isArray(data)) {
        continue;
      }

      data.forEach(partita => {
        const dataPartitaLocale = dataLocaleDaISO(partita.commence_time);

        if (dataPartitaLocale !== dataScelta) {
          return;
        }

        const nomePartita = partita.home_team + " - " + partita.away_team;
        const dataOra = new Date(partita.commence_time).toLocaleString("it-IT");

        if (!partita.bookmakers || partita.bookmakers.length === 0) return;

        partita.bookmakers.forEach(bookmaker => {
          if (!bookmaker.markets) return;

          bookmaker.markets.forEach(market => {
            if (market.key !== "totals") return;

            market.outcomes.forEach(outcome => {
              const quota = Number(outcome.price);
              const linea = Number(outcome.point);

              if (!quota || !linea) return;

              if (
                outcome.name === "Over" &&
                linea === 2.5 &&
                quota <= SOGLIA_OVER_25
              ) {
                overList.push({
                  partita: nomePartita,
                  campionato: campionato.nome,
                  ora: dataOra,
                  quota: quota,
                  bookmaker: bookmaker.title,
                  probabilita: probabilitaDaQuota(quota)
                });
              }

              if (
                outcome.name === "Under" &&
                linea === 2.5 &&
                quota <= SOGLIA_UNDER_25
              ) {
                underList.push({
                  partita: nomePartita,
                  campionato: campionato.nome,
                  ora: dataOra,
                  quota: quota,
                  bookmaker: bookmaker.title,
                  probabilita: probabilitaDaQuota(quota)
                });
              }
            });
          });
        });
      });
    }

    overList.sort((a, b) => a.quota - b.quota);
    underList.sort((a, b) => a.quota - b.quota);

    overDiv.innerHTML = overList.length
      ? overList.map(creaCardOver).join("")
      : "<div class='error'>Nessun Over 2.5 trovato per questa data con quota ≤ " + SOGLIA_OVER_25 + "</div>";

    underDiv.innerHTML = underList.length
      ? underList.map(creaCardUnder).join("")
      : "<div class='error'>Nessun Under 2.5 trovato per questa data con quota ≤ " + SOGLIA_UNDER_25 + "</div>";

  } catch (errore) {
    overDiv.innerHTML = "<div class='error'>Errore nel caricamento API.</div>";
    underDiv.innerHTML = "<div class='error'>Errore nel caricamento API.</div>";
    console.log(errore);
  }
}

function creaCardOver(x) {
  return `
    <div class="card over">
      <div class="match">${x.partita}</div>
      <div class="info">${x.campionato}</div>
      <div class="info">${x.ora}</div>
      <div class="quota">Over 2.5 @ ${x.quota}</div>
      <div class="info">Probabilità stimata: ${x.probabilita}%</div>
      <div class="info">Bookmaker: ${x.bookmaker}</div>
    </div>
  `;
}

function creaCardUnder(x) {
  return `
    <div class="card under">
      <div class="match">${x.partita}</div>
      <div class="info">${x.campionato}</div>
      <div class="info">${x.ora}</div>
      <div class="quota">Under 2.5 @ ${x.quota}</div>
      <div class="info">Probabilità stimata: ${x.probabilita}%</div>
      <div class="info">Bookmaker: ${x.bookmaker}</div>
    </div>
  `;
}

impostaDataOggi();
caricaDati();

document.getElementById("dataScelta").addEventListener("change", caricaDati);
</script>

</body>
</html>
