name: Aggiorna pronostici Over 1.5

on:
  workflow_dispatch:

  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write

concurrency:
  group: aggiorna-pronostici
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Aggiorna partite.json
        run: |
          python aggiorna_partite.py

          - name: Upload HTML
  uses: actions/upload-artifact@v4
  with:
    name: pagina-html
    path: pagina.html

      - name: Controlla JSON
        run: |
          python -m json.tool partite.json > /dev/null

      - name: Salva aggiornamento
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add partite.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Aggiorna pronostici Over 1.5"
            git push
          fi
